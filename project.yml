name: AeroPressGuide
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  AeroPressGuide:
    type: application
    platform: iOS
    sources:
      - AeroPressGuide
    entitlements:
      path: AeroPressGuide/AeroPressGuide.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.yourname.aeropressguide
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.yourname.aeropressguide
        aps-environment: development
    info:
      path: AeroPressGuide/Info.plist
      properties:
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.aeropressguide
        PRODUCT_NAME: AeroPressGuide
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: true
